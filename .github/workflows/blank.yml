# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "master", "testgha" ]
  pull_request:
    branches: [ "master", "testgha" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  example_matrix:
    strategy:
      matrix:
        mynode: [18, 20]
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.mynode }}
      - name: Run a multi-line script
        run: |
          echo "Running on node `node --version` on `hostname` with `uname --operating-system` on `date` (`TZ=America/Los_Angeles date`)."
          echo "Running on node `node --version` on `hostname` with `uname --operating-system` on `date`." >> $GITHUB_STEP_SUMMARY

